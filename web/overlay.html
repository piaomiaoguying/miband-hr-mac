<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心率悬浮层</title>
<style>
  :root {
    --accent: #e66767;
    --scale: 1;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    color: #ffffff;
    font-family: system-ui, -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: opacity .25s ease;
  }
  body.idle { opacity: .35; }
  body.hide-idle.idle { opacity: 0; }
  .wrap {
    display: inline-flex; align-items: center; justify-content: center;
    gap: calc(16px * var(--scale));
    padding: calc(12px * var(--scale)) calc(20px * var(--scale));
    border-radius: calc(24px * var(--scale));
  }
  body.with-bg .wrap { background: rgba(0, 0, 0, .38); backdrop-filter: blur(3px); }
  .heart {
    width: calc(44px * var(--scale));
    height: calc(40px * var(--scale));
    flex: none;
    color: var(--accent);
    animation: beat var(--beat, 1.15s) ease-in-out infinite;
    transform-origin: 50% 55%;
    filter: drop-shadow(0 0 calc(14px * var(--scale)) color-mix(in srgb, var(--accent) 55%, transparent));
  }
  .readout { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
  .bpm {
    font-size: calc(96px * var(--scale));
    line-height: .84;
    font-weight: 600;
    letter-spacing: -.055em;
    text-shadow: 0 2px 16px rgba(0, 0, 0, .55), 0 0 2px rgba(0, 0, 0, .45);
  }
  .unit {
    margin-top: calc(8px * var(--scale));
    font-size: calc(12px * var(--scale));
    font-weight: 500;
    letter-spacing: .22em;
    color: rgba(255, 255, 255, .78);
    text-shadow: 0 1px 8px rgba(0, 0, 0, .5);
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.13); }
    24% { transform: scale(1); }
    36% { transform: scale(1.06); }
    48% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="heart" id="heart" viewBox="0 0 32 29" aria-hidden="true"><path fill="currentColor" d="M16 29S1 19.6 1 9.9C1 4.9 4.8 1 9.7 1c2.7 0 5.2 1.3 6.3 3.4C17.1 2.3 19.6 1 22.3 1 27.2 1 31 4.9 31 9.9 31 19.6 16 29 16 29z"/></svg>
    <div class="readout">
      <div class="bpm" id="bpm">--</div>
      <div class="unit" id="unit">BPM</div>
    </div>
  </div>
<script>
(() => {
  "use strict";

  const params = new URLSearchParams(location.search);
  const scaleRaw = Number.parseFloat(params.get("scale") || params.get("size") || "1");
  const scale = Number.isFinite(scaleRaw) ? Math.min(4, Math.max(0.4, scaleRaw)) : 1;
  const colorRaw = params.get("color") || "";
  const color = /^#[0-9a-f]{6}$/i.test(colorRaw) ? colorRaw : null;
  const hideIdle = params.get("hide-idle") === "1";
  const withBg = params.get("bg") === "1";

  document.documentElement.style.setProperty("--scale", String(scale));
  if (color) document.documentElement.style.setProperty("--accent", color);
  if (params.get("heart") === "0") document.getElementById("heart").hidden = true;
  if (params.get("label") === "0") document.getElementById("unit").hidden = true;
  if (hideIdle) document.body.classList.add("hide-idle");
  if (withBg) document.body.classList.add("with-bg");

  const bpmEl = document.getElementById("bpm");
  const heart = document.getElementById("heart");
  let polling = false;

  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const response = await fetch("/api/state?minutes=5", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const fresh = data.status === "live" || data.status === "holding";
      const hasBpm = Number.isFinite(data.bpm);
      bpmEl.textContent = hasBpm ? String(data.bpm) : "--";
      document.body.classList.toggle("idle", !fresh || !hasBpm);
      heart.style.setProperty("--beat", fresh && hasBpm ? `${Math.min(1.4, Math.max(0.38, 60 / data.bpm))}s` : "1.15s");
    } catch (error) {
      bpmEl.textContent = "--";
      document.body.classList.add("idle");
      heart.style.setProperty("--beat", "1.15s");
    } finally {
      polling = false;
    }
  }

  poll();
  setInterval(poll, 500);
})();
</script>
</body>
</html>
